<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <filter id="s14" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#38bdf8" fill-opacity=".55"/>
    </marker>
  </defs>

  <g filter="url(#s14)">
    <rect x="190" y="140" width="900" height="440" rx="28" fill="#0b1223" stroke="#38bdf8" stroke-opacity=".22" stroke-width="2"/>

    <!-- steps -->
    <g transform="translate(260 235)">
      <rect x="0" y="0" width="180" height="90" rx="20" fill="#0f172a" stroke="#38bdf8" stroke-opacity=".14"/>
      <rect x="0" y="120" width="180" height="90" rx="20" fill="#0f172a" stroke="#38bdf8" stroke-opacity=".12"/>
      <rect x="0" y="240" width="180" height="90" rx="20" fill="#0f172a" stroke="#38bdf8" stroke-opacity=".10"/>

      <rect x="380" y="0" width="180" height="90" rx="20" fill="#0f172a" stroke="#38bdf8" stroke-opacity=".14"/>
      <rect x="380" y="120" width="180" height="90" rx="20" fill="#0f172a" stroke="#38bdf8" stroke-opacity=".12"/>
      <rect x="380" y="240" width="180" height="90" rx="20" fill="#0f172a" stroke="#38bdf8" stroke-opacity=".10"/>

      <!-- icons -->
      <g opacity=".75">
