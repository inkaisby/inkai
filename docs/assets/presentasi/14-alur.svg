        <circle cx="60" cy="165" r="18" fill="#22c55e"/>
        <circle cx="60" cy="285" r="18" fill="#f59e0b"/>
        <rect x="430" y="27" width="60" height="36" rx="12" fill="#38bdf8" opacity=".25"/>
