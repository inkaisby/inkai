<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <filter id="s15" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <g filter="url(#s15)">
    <rect x="200" y="140" width="880" height="440" rx="28" fill="#0b1223" stroke="#38bdf8" stroke-opacity=".22" stroke-width="2"/>

    <!-- three scenario cards -->
    <g transform="translate(260 220)">
      <rect x="0" y="0" width="760" height="100" rx="22" fill="#0f172a" stroke="#38bdf8" stroke-opacity=".12"/>
      <rect x="0" y="130" width="760" height="100" rx="22" fill="#0f172a" stroke="#38bdf8" stroke-opacity=".12"/>
      <rect x="0" y="260" width="760" height="100" rx="22" fill="#0f172a" stroke="#38bdf8" stroke-opacity=".12"/>

      <!-- icons -->
      <g opacity=".8">
        <!-- card -->
        <rect x="30" y="22" width="70" height="56" rx="14" fill="#38bdf8" opacity=".22"/>
        <circle cx="55" cy="50" r="10" fill="#38bdf8" opacity=".75"/>
        <rect x="70" y="43" width="20" height="12" rx="6" fill="#22c55e" opacity=".6"/>

        <!-- clipboard -->
        <rect x="30" y="152" width="70" height="56" rx="14" fill="#22c55e" opacity=".16"/>
        <rect x="45" y="145" width="40" height="18" rx="9" fill="#22c55e" opacity=".35"/>
        <rect x="45" y="170" width="40" height="10" rx="5" fill="#94a3b8" opacity=".25"/>
        <rect x="45" y="188" width="30" height="10" rx="5" fill="#94a3b8" opacity=".22"/>

        <!-- megaphone -->
        <path d="M30 305 L80 285 L80 355 L30 335 Z" fill="#f59e0b" opacity=".18"/>
        <rect x="82" y="305" width="18" height="30" rx="9" fill="#f59e0b" opacity=".30"/>
        <path d="M105 305 C130 295, 130 345, 105 335" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" opacity=".35"/>
      </g>

      <!-- text placeholders -->
      <g fill="#94a3b8" opacity=".22">
        <rect x="125" y="30" width="500" height="16" rx="8"/>
        <rect x="125" y="56" width="420" height="14" rx="7"/>

        <rect x="125" y="160" width="520" height="16" rx="8"/>
        <rect x="125" y="186" width="380" height="14" rx="7"/>

        <rect x="125" y="290" width="470" height="16" rx="8"/>
        <rect x="125" y="316" width="410" height="14" rx="7"/>
      </g>
    </g>
  </g>
</svg>
